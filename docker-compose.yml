services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: habit-tracker-app
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_PATH=/app/server/data/habits.db
    volumes:
      - habits-data:/app/server/data

volumes:
  habits-data:
    name: habit_tracker_data
    driver: local
